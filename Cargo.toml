[workspace]
members = [
    "crates/*",
    "python/refix-engine",
]
# The stock packages need `just generate-stock` first.
default-members = [
    "crates/refix",
    "crates/refix-cli",
    "crates/refix-codegen",
    "crates/refix-dictionary",
    "crates/refix-message",
]
resolver = "3"

[workspace.package]
authors = ["David Steiner <david@davidsteiner.dev>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/refixhq/refix"
repository = "https://github.com/refixhq/refix"
keywords = ["fix", "fix-protocol", "fix-engine", "trading", "finance"]
categories = ["encoding", "parsing", "finance"]

[workspace.dependencies]
bigdecimal-04 = { package = "bigdecimal", version = "0.4.7", default-features = false }
bytes = "1.12.1"
chrono-04 = { package = "chrono", version = "0.4.35", default-features = false }
clap = { version = "4.6.5", features = ["derive"] }
criterion = "0.8.0"
jiff-02 = { package = "jiff", version = "0.2.0", default-features = false }
pyo3 = "0.29.0"
roxmltree = "0.21.0"
rust_decimal-1 = { package = "rust_decimal", version = "1.13.0", default-features = false }
serde = "1.0.229"
time-03 = { package = "time", version = "0.3.38", default-features = false }

# Major and minor only, so a patch release doesn't re-release dependents.
refix-codegen = { version = "0.4", path = "crates/refix-codegen" }
refix-dictionary = { version = "0.4", path = "crates/refix-dictionary" }
refix-message = { version = "0.4", path = "crates/refix-message" }
