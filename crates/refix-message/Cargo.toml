[package]
name = "refix-message"
description = "Framing, tokenisation and raw message representation for the ReFIX engine"
version = "0.4.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
bench = false

[[bench]]
name = "tokenize"
harness = false

[dependencies]
bigdecimal-04 = { workspace = true, optional = true }
bytes = { workspace = true }
chrono-04 = { workspace = true, optional = true }
jiff-02 = { workspace = true, optional = true }
rust_decimal-1 = { workspace = true, optional = true }
time-03 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[package.metadata.docs.rs]
all-features = true
