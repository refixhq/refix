[package]
name = "refix-cli"
description = "Command-line tools for ReFIX, a FIX protocol engine"
version = "0.3.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "refix"
path = "src/main.rs"
# cargo doc skips this binary. Its docs would overwrite the refix crate's.
doc = false

[dependencies]
clap = { workspace = true }
refix-codegen = { workspace = true }
refix-dictionary = { workspace = true }
