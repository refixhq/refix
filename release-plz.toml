[workspace]
# Publish only when a release PR is merged, not on every push to main.
release_always = false

[[package]]
# Not on crates.io, so its version comes from its existing git tags.
name = "refix-engine"
git_only = true
git_tag_name = "python-v{{ version }}"
# Features bump the minor version, as Python users expect.
features_always_increment_minor = true

[[package]]
# The generated module is gitignored, so cargo sees it as uncommitted.
name = "refix-fix44"
publish_allow_dirty = true
# release-plz can't semver-check generated code, so every release is minor.
semver_check = false
custom_minor_increment_regex = ".*"
