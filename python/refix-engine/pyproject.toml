[build-system]
requires = ['maturin>=1.9.4,<2']
build-backend = 'maturin'

[project]
name = "refix-engine"
description = "FIX message processing for Python, powered by Rust"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "refix._core"
features = ["pyo3/extension-module"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pytest>=8",
]