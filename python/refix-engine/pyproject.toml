[build-system]
requires = ['maturin>=1.9.4,<2']
build-backend = 'maturin'

[project]
name = "refix-engine"
description = "FIX message processing for Python, powered by Rust"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "David Steiner", email = "david@davidsteiner.dev" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/refixhq/refix"

[tool.maturin]
python-source = "python"
module-name = "refix._core"
features = ["pyo3/extension-module"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "maturin>=1.9.4,<2",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.coverage.run]
source = ["refix"]

[tool.coverage.paths]
source = ["python/refix", "*/site-packages/refix"]

[tool.pyright]
include = ["python", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"