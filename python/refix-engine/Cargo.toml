[package]
name = "refix-engine"
version = "0.2.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
bytes = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py312"] }
# No version, so every refix-message release ships a new wheel.
refix-message = { path = "../../crates/refix-message" }
